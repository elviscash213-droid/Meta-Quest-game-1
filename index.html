scene.add(new THREE.HemisphereLight(0xffffff,0x567343,2));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-30,65,25);scene.add(sun);

const fallbackField=new THREE.Group();
const grass=mat(0x326c38),dirt=mat(0x9b6d48),white=mat(0xf3eee0),red=mat(0xb52c2d),blue=mat(0x204b87),skin=mat(0xd9a178),metal=mat(0x454b55);

line([0,.06,0],[46,.06,-46]);line([0,.06,0],[-46,.06,-46]);
for(const [x,z] of [[0,0],[14,-14],[0,-28],[-14,-14]]){let b=mesh(new THREE.BoxGeometry(1,.09,1),white,x,.06,z);b.rotation.y=Math.PI/4}

const fence=mat(0x203f55);for(let i=0;i<42;i++){const a=Math.PI*.05+i*Math.PI*.9/41;const x=Math.cos(a)*83,z=-Math.sin(a)*83;let p=mesh(new THREE.BoxGeometry(4,4,.3),fence,x,2,z);p.rotation.y=-a+Math.PI/2}

function person(x,z,shirt){const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);

const loadStatus=document.createElement('div');loadStatus.style.cssText='position:fixed;top:64px;left:12px;color:white;background:#071322aa;padding:5px 9px;border-radius:6px;font:12px system-ui';loadStatus.textContent='Loading imported stadium…';document.body.appendChild(loadStatus);
new GLTFLoader().load(assetUrl,gltf=>{
 const stadium=gltf.scene;
 const bounds=new THREE.Box3().setFromObject(stadium),size=new THREE.Vector3(),center=new THREE.Vector3();bounds.getSize(size);bounds.getCenter(center);
 // Center on the imported park; preserve its real-world metre scale.

const physics=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});

function injuryLabel(p){if(!p.injuries)return '';return Object.entries(p.injuries).filter(([k,v])=>v>0).map(([k,v])=>k.toUpperCase()+' '+(v>=2?'FRACTURED':'BRUISED')).join(' · ')}
function wound(p,force,point){
 if(!p.injuries)p.injuries={leftArm:0,rightArm:0,leftLeg:0,rightLeg:0,torso:0};
 const keys=Object.keys(p.injuries);const relative=point.clone().sub(p.group.position);

 if(!keys.includes(limb))limb='torso';

 if(p.injuries[limb]>=2){p.health=Math.max(0,p.health-1);p.group.rotation.z+=limb==='leftLeg'?-.12:limb==='rightLeg'?.12:0}

}

 if(!bloodEnabled)return;

 for(let i=0;i<count;i++){
  const radius=.018+Math.random()*.035;
  const o=new THREE.Mesh(new THREE.SphereGeometry(radius,5,4),new THREE.MeshBasicMaterial({color:Math.random()>.45?0x940609:0x5c0508}));
  o.position.copy(point);scene.add(o);

 }
}
function bloodStain(point){
 if(!bloodEnabled||bloodDecals.length>=80)return;
 const m=new THREE.Mesh(new THREE.CircleGeometry(.09+Math.random()*.16,10),new THREE.MeshBasicMaterial({color:0x650407,transparent:true,opacity:.72,depthWrite:false,side:THREE.DoubleSide}));
 m.rotation.x=-Math.PI/2;m.position.set(point.x,.023+Math.random()*.003,point.z);scene.add(m);bloodDecals.push(m);
}
function buildRagdoll(p,impulse){
 if(p.ragdoll)return;
 p.group.visible=false;p.ragdoll=true;
 const center=p.group.position.clone();bloodStain(center);
 const specs=[
 ['torso',0,1.25,0,.36,.48,.2,3],
 ['head',0,2.03,0,.25,.25,.25,1],
 ['left arm',-.57,1.32,0,.15,.42,.15,.7],
 ['right arm',.57,1.32,0,.15,.42,.15,.7],
 ['left leg',-.2,.48,0,.17,.47,.17,1.5],
 ['right leg',.2,.48,0,.17,.47,.17,1.5]];

 for(const [name,x,y,z,sx,sy,sz,mass] of specs){
  const b=new CANNON.Body({mass,shape:new CANNON.Box(new CANNON.Vec3(sx,sy,sz)),position:new CANNON.Vec3(center.x+x,y,center.z+z),linearDamping:.12,angularDamping:.2});
  physics.addBody(b);
  const visual=new THREE.Mesh(new THREE.BoxGeometry(sx*2,sy*2,sz*2),name==='torso'?red:name==='head'?skin:name.includes('arm')?skin:metal);
  scene.add(visual);ragdolls.push({body:b,visual});bodies.push(b);
 }
 const joints=[[0,1,0,.43,0,0,-.25,0],[0,2,-.37,.23,0,0,.35,0],[0,3,.37,.23,0,0,.35,0],[0,4,-.2,-.57,0,0,.47,0],[0,5,.2,-.57,0,0,.47,0]];
 for(const [a,b,ax,ay,az,bx,by,bz] of joints){
  const c=new CANNON.PointToPointConstraint(bodies[a],new CANNON.Vec3(ax,ay,az),bodies[b],new CANNON.Vec3(bx,by,bz),1e5);physics.addConstraint(c);
 }

}
function hitEffect(pos){for(let i=0;i<8;i++){const obj=new THREE.Mesh(new THREE.SphereGeometry(.025,5,4),new THREE.MeshBasicMaterial({color:0xffb544}));obj.position.copy(pos);scene.add(obj);effects.push({obj,vel:new THREE.Vector3((Math.random()-.5)*3,Math.random()*2,(Math.random()-.5)*3),life:.35})}}
function combatHit(){
 const now=performance.now();if(now-lastCombat<280)return;lastCombat=now;
 const hand=controller1.getWorldPosition(new THREE.Vector3());const forward=new THREE.Vector3(0,0,-1).applyQuaternion(controller1.getWorldQuaternion(new THREE.Quaternion())).normalize();
 const origin=renderer.xr.isPresenting?hand:camera.getWorldPosition(new THREE.Vector3());
 const dir=renderer.xr.isPresenting?forward:new THREE.Vector3(0,-.1,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion())).normalize();
 let best=null,bestDist=Infinity;
 for(const p of players){if(!p.alive)continue;const target=p.group.position.clone().add(new THREE.Vector3(0,1.2,0));const diff=target.sub(origin);const along=diff.dot(dir);const lateral=diff.clone().addScaledVector(dir,-along).length();if(along>0&&along<(weaponKind==='BAT'?2.6:1.45)&&lateral<.95&&along<bestDist){best=p;bestDist=along}}
 if(!best){announce('MISS');return}
 const force=weaponKind==='BAT'?8:4;best.health-=weaponKind==='BAT'?2:1;
 const pos=best.group.position.clone().add(new THREE.Vector3(0,1.4,0));hitEffect(pos);const damage=wound(best,force,pos);bloodBurst(pos,dir,force);if(best.injuries.leftLeg>=2||best.injuries.rightLeg>=2)best.group.position.y=-.22;

const modelStatus=document.createElement('div');modelStatus.style.cssText='position:fixed;top:96px;left:12px;background:#071322bb;color:white;padding:5px 9px;border-radius:6px;font:12px system-ui';modelStatus.textContent='Loading imported animated players…';document.body.appendChild(modelStatus);
const mixers=[];const modelURL='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb';
new GLTFLoader().load(modelURL,gltf=>{
 const clips=gltf.animations;const available=clips.map(c=>c.name);
 const idle=clips.find(c=>/^idle$/i.test(c.name))||clips[0],walk=clips.find(c=>/^walk$/i.test(c.name)),run=clips.find(c=>/^run$/i.test(c.name));

  const copy=THREE.SkeletonUtils?THREE.SkeletonUtils.clone(gltf.scene):null;
 });
 // GLTF skeletons must be cloned with SkeletonUtils, not Object3D.clone.
 import('three/addons/utils/SkeletonUtils.js').then(({clone})=>{
  players.forEach((p,i)=>{
   const model=clone(gltf.scene);
   const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3());

   p.model=model;p.mixer=new THREE.AnimationMixer(model);mixers.push(p.mixer);

   p.currentAction=p.mixer.clipAction(idle);p.currentAction.play();
   p.clips={idle:idle.name,walk:walk?.name,run:run?.name};
  });
  modelStatus.textContent='5 imported rigged players · '+available.join(', ');
 }).catch(e=>reportError('Skeleton cloning',e));
},undefined,e=>{modelStatus.textContent='Player model failed — placeholders active';reportError('Animated player GLB '+modelURL,e)});
function playCharacter(p,name){if(!p.mixer||!p.clips)return;const key=p.clips[name]||p.clips.idle;const next=p.actions[key.toLowerCase()];if(next&&next!==p.currentAction){next.reset().fadeIn(.22).play();p.currentAction?.fadeOut(.22);p.currentAction=next}}

let ball=null,velocity=new THREE.Vector3(),state={inning:1,half:'BOTTOM',home:0,away:0,hr:0,kos:0,outs:0,balls:0,strikes:0,bases:[false,false,false],mode:'BAT',flying:false,contact:false,gameOver:false},lastPitch=0,lastSwing=0;
function count(){document.getElementById('count').textContent=state.half+' · '+state.balls+'-'+state.strikes+' · BASES '+state.bases.map(v=>v?'●':'○').join('')}
function clearCount(){state.balls=0;state.strikes=0;count()}
function advance(n){let runs=0;const next=[false,false,false];for(let i=2;i>=0;i--)if(state.bases[i]){if(i+n>=3)runs++;else next[i+n]=true}if(n>=4)runs++;else next[n-1]=true;state.bases=next;state.home+=runs;clearCount();announce(n===4?'HOME RUN · '+runs+' RUNS!':n===1?'SINGLE':n===2?'DOUBLE':'TRIPLE');hud()}
function walk(){let b=state.bases;if(b[0]&&b[1]&&b[2])state.home++;if(b[0]&&b[1])b[2]=true;if(b[0])b[1]=true;b[0]=true;clearCount();announce('BALL FOUR · WALK');hud()}
function strike(){state.strikes++;if(state.strikes>=3){announce('STRIKE THREE!');out()}else{announce('STRIKE '+state.strikes);hud()}}
function takePitch(){if(!ball||!state.flying||state.contact)return;const inZone=Math.abs(ball.position.x)<.48;state.flying=false;scene.remove(ball);ball=null;if(inZone)strike();else{state.balls++;if(state.balls>=4)walk();else{announce('BALL '+state.balls);hud()}}}
function finishGame(){state.gameOver=true;state.flying=false;announce('FINAL · HOME '+state.home+' / AWAY '+state.away+' · HR '+state.hr+' · KOs '+state.kos);document.getElementById('panel').querySelector('b').textContent='FINAL SCORE · HOME '+state.home+' : AWAY '+state.away+' · HOME RUNS '+state.hr+' · KOs '+state.kos}

const ballGeo=new THREE.SphereGeometry(.115,12,10),ballMat=white;
function announce(t){document.getElementById('msg').textContent=t;setTimeout(()=>{if(document.getElementById('msg').textContent===t)document.getElementById('msg').textContent=''},1500)}
function hud(){document.getElementById('score').textContent='INNING '+state.inning+' / 9 · HOME '+state.home+' : AWAY '+state.away;document.getElementById('status').textContent='HR '+state.hr+' · KOs '+state.kos+' · OUTS '+state.outs;document.getElementById('mode').textContent='MODE: '+state.mode;count()}
function pitch(){if(state.gameOver)return;if(ball)scene.remove(ball);ball=mesh(ballGeo,ballMat,0,1.8,-18);velocity.set((Math.random()-.5)*.8,.15,13+Math.random()*4);state.flying=true;state.contact=false;lastPitch=performance.now();announce('PITCH!')}
function out(){state.outs++;state.flying=false;clearCount();if(state.outs>=3){state.outs=0;state.bases=[false,false,false];state.inning++;announce(state.inning>9?'FINAL SCORE':'NEXT INNING');if(state.inning>9)finishGame()}else announce('OUT '+state.outs);hud()}
function swing(){if(state.gameOver)return;lastSwing=performance.now();if(state.mode==='BRAWL'){combatHit();return}
if(!ball||!state.flying){announce('WAIT FOR PITCH');return}
const d=ball.position.distanceTo(new THREE.Vector3(0,1.5,0));if(d<4.2){velocity.set((Math.random()-.5)*9,12+Math.random()*7,-19-Math.random()*17);state.contact=true;announce('CRACK!')}else{strike();announce('SWING AND MISS')}}
function switchWeapon(){weaponKind=weaponKind==='BAT'?'FISTS':'BAT';document.getElementById('weaponSwitch').textContent='WEAPON: '+weaponKind;weapon.visible=weaponKind==='BAT';announce(weaponKind+' EQUIPPED')}
document.getElementById('weaponSwitch').onclick=switchWeapon;
function toggle(){state.mode=state.mode==='BAT'?'BRAWL':'BAT';hud();announce(state.mode+' MODE')}
document.getElementById('pitch').onclick=pitch;document.getElementById('take').onclick=takePitch;document.getElementById('swing').onclick=swing;document.getElementById('mode').onclick=toggle;document.getElementById('reset').onclick=()=>location.reload();
const controller0=renderer.xr.getController(0),controller1=renderer.xr.getController(1);rig.add(controller0,controller1);
controller0.addEventListener('selectstart',pitch);controller1.addEventListener('selectstart',swing);
const weapon=new THREE.Group();const handle=new THREE.Mesh(new THREE.CylinderGeometry(.045,.05,.8,12),mat(0x744525));handle.position.y=-.05;weapon.add(handle);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.09,.055,.8,12),mat(0xa4a8ad));barrel.position.y=.73;weapon.add(barrel);weapon.rotation.x=Math.PI/2;controller1.add(weapon);
renderer.xr.addEventListener('sessionstart',()=>{modelStatus.textContent+=' · VR session started'});renderer.xr.addEventListener('sessionend',()=>{modelStatus.textContent+=' · VR session ended'});const clock=new THREE.Clock();let prev=performance.now(),buttonHeld=false;
renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min((now-prev)/1000,.04);prev=now;
if(state.flying&&ball){ball.position.addScaledVector(velocity,dt);velocity.y-=9.81*dt;if(ball.position.z>4&&velocity.z>0){takePitch()}
else if(ball.position.y<.12){if(state.contact&&velocity.z<0&&ball.position.z<-75){state.hr++;advance(4)}else if(state.contact&&velocity.z<0){const distance=-ball.position.z;advance(distance>55?3:distance>32?2:1)}else if(!state.contact){takePitch()}else out();state.flying=false;if(ball){scene.remove(ball);ball=null}}}
